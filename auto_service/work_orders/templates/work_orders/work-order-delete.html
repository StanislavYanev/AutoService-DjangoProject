{%  extends "home.html" %}
{%  block title %}
    Confirm Delete
{%  endblock %}
{% block content %}

<h1>Confirm Delete</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm</button>
    <a href="{% url 'work_orders:work_orders_search' %}">Cancel</a>
</form>
{% endblock %}
