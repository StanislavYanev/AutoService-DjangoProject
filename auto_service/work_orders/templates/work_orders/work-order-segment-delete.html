{% extends 'home.html' %}
{% block title %}
    Delete WO {{ work_order }}
{% endblock %}

{%  block content %}
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete "{{ segment }} from {{ work_order }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm</button>
    </form>
    <a href="{% url 'work_orders:workorder_detail' work_order.pk %}">Cancel</a>
{%  endblock %}
