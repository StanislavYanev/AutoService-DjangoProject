{% extends "home.html" %}
{% block title %}
    Create Segment
{% endblock %}

{% block content %}
    <div>
        <form method="post">
            <p> {{ model }}</p>
            <a href="{% url 'work_orders:workorder_detail' work_order.pk %}">Back</a>
            <h3>Add segment to {{ work_order }}</h3>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Segment</button>


        </form>
    </div>
{% endblock %}
